    - {click: 's', long_click: '!'}
    - {click: 'd', long_click: '@'}
    - {click: 'f', long_click: '#'}
    - {click: 'g', long_click: '%'}
    - {click: 'h', long_click: "'"}
    - {click: 'j', long_click: '&'}
    - {click: 'k', long_click: '*'}
    - {click: 'l', long_click: '?'}
    - {width: 5}
