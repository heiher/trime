    author: "hev <r@hevcc>"
    ascii_mode: 0
    width: 20
    height: 45
    keys:
    - {click: '+'}
    - {click: '1'}
    - {click: '2'}
    - {click: '3'}
    - {click: '*'}
    - {click: '-'}
    - {click: '4'}
    - {click: '5'}
    - {click: '6'}
    - {click: '/'}
    - {click: '='}
    - {click: '7'}
    - {click: '8'}
    - {click: '9'}
    - {click: BackSpace}
    - {click: Keyboard_default, long_click: Keyboard_symbols}
    - {click: '.', long_click: '#'}
    - {click: '0'}
    - {click: space}
    - {click: Return}
  symbols:
    name: 符號
    author: "hev <r@hev.cc>"
    ascii_mode: 0
    width: 10
    height: 45
    keys:
    - {click: '!', long_click: '1'}
    - {click: '@', long_click: '2'}
    - {click: '#', long_click: '3'}
    - {click: '$', long_click: '4'}
