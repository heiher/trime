    - {click: '-', long_click: '_'}
    - {click: '×', long_click: '÷'}
    - {click: '‰', long_click: '‱'}
    - {click: '=', long_click: '≠'}
    - {click: '≈', long_click: '≉'}
    - {click: '[', long_click: '{'}
    - {click: ']', long_click: '}'}
    - {click: '\', long_click: '|'}
    - {click: '§', long_click: '¦'}
    - {click: '©', long_click: '®'}
    - {click: '✔', long_click: '✘'}
    - {click: '￥', long_click: '￡'}
