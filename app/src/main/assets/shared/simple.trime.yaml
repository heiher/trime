tool_bar:
  button_spacing: 5 # 按钮间距
  button_font: iconfont.ttf # 按钮字体
  back_style: "ic@arrow-left" # 左侧返回按钮样式

  expand_button: &expand_button
    foreground:
      style: "ic@emoticon"
    action: liquid_keyboard_history

  paste_button: &paste_button
    foreground:
      style: "ic@content_paste"
      font_size: 18  # 按钮字体大小
      padding: 10
    action: paste

  copy_button: &copy_button
    foreground:
      style: "ic@content_copy"
      font_size: 18  # 按钮字体大小
      padding: 10
    action: copy

  cut_button: &cut_button
    foreground:
      style: "ic@content_cut"
      font_size: 18  # 按钮字体大小
      padding: 10
    action: cut

  select_all_button: &select_all_button
    foreground:
      style: "ic@select_all"
      font_size: 18  # 按钮字体大小
      padding: 10
    action: select_all

  ascii_mode_button: &ascii_mode_button
    foreground:
      option_styles: ["中", "En"] # 样式也可以为表，将根据 action 的 toggle 决定
      font_size: 18  # 按钮字体大小
      padding: 10
    action: Mode_switch

  # 右侧按钮列表（从右向左排列）
  buttons: [ *expand_button, *paste_button, *copy_button, *cut_button, *select_all_button, *ascii_mode_button]

liquid_keyboard:
  # 目前只能直接写参数，不支持变量或者fallback机制。
  # 缺少参数时，自动从style中加载参数。除非需要指定liquid_keyboard使用与主键盘不同的背景色、背景图，否则不应设置被注释掉的参数。
  author: "hev"
  row: 6              #每屏最多显示多少行按键
  row_land: 5         #横屏每屏最多显示多少行按键
  key_height: 40      #按键高度
  key_height_land: 40 #横屏模式按键高度
  single_width: 60    #single类型的按键宽度
  vertical_gap: 8     #纵向按键间隙
  margin_x: 5       #左右按键间隙的1/2
  fixed_key_bar: # 固定按键条
    position: bottom # 摆放位置（在滚动区域的……） top|bottom|left|right
    keys: # 按键（显示名称为对应的label，不能放太多）
      - liquid_keyboard_exit
      - BackSpace2
      - Return2
